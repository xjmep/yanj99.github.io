<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>YANJ | 页面更新中</title>

<!-- 阿里巴巴普惠体 WebFont（字由 CDN，免费商用） -->
<link type="text/css" rel="stylesheet" href="https://webfont.hellofont.cn/webfont/puhuiti-2?weight=85&family=puhuiti-2-85">
<link type="text/css" rel="stylesheet" href="https://webfont.hellofont.cn/webfont/puhuiti-2?weight=55&family=puhuiti-2-55">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background-color: #000000;
    color: #ffffff;
    overflow: hidden;
  }

  /* 背景漂浮光点 */
  .bg-dots { position: fixed; inset: 0; z-index: 0; }
  .bg-dots span {
    position: absolute;
    bottom: -10px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.35);
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    from { transform: translateY(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    to   { transform: translateY(-110vh); opacity: 0; }
  }

  .container {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    /* 内容上移，让视觉更居中（补偿底部联系方式占用的空间） */
    transform: translateY(-6vh);
    padding: 0 1rem;
  }

  /* 旋转加载圆环 */
  .spinner {
    width: 56px; height: 56px;
    border: 4px solid rgba(255, 255, 255, 0.15);
    border-top-color: #ffffff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* 主文案：阿里巴巴普惠体 Bold（85），禁止换行，字号随屏宽自适应 */
  .main-text {
    font-family: "puhuiti-2-85";
    font-size: clamp(1.15rem, 5.5vw, 3rem);
    font-weight: bold;
    letter-spacing: 0.08em;
    text-align: center;
    white-space: nowrap;   /* 禁止跨行 */
    animation: breathe 2.5s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  .dots span {
    display: inline-block;
    animation: bounce 1.4s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-0.35em); }
  }

  /* 底部联系方式：阿里巴巴普惠体 Regular（55），禁止换行 */
  .contact {
    position: fixed;
    bottom: calc(2rem + env(safe-area-inset-bottom, 0px));
    left: 0;
    width: 100%;
    text-align: center;
    font-size: clamp(0.75rem, 3.2vw, 1rem);
    font-family: "puhuiti-2-55";
    font-weight: normal;
    color: #cccccc;
    white-space: nowrap;   /* 禁止跨行 */
    padding: 0 0.5rem;
    z-index: 1;
  }
  .contact a {
    color: #ffffff;
    text-decoration: none;
  }
  .contact a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="bg-dots" id="bgDots"></div>

  <div class="container">
    <div class="spinner"></div>
    <div class="main-text">
      页面更新中<span class="dots"><span>.</span><span>.</span><span>.</span></span>敬请期待
    </div>
  </div>

  <div class="contact">
   联系邮箱： <a href="mailto:service@yanj.org.cn">service@yanj.org.cn</a>
  </div>

  <script>
    // 随机生成漂浮光点
    (function () {
      var box = document.getElementById('bgDots');
      for (var i = 0; i < 30; i++) {
        var s = document.createElement('span');
        s.style.left = Math.random() * 100 + '%';
        s.style.animationDuration = (6 + Math.random() * 8) + 's';
        s.style.animationDelay = (-Math.random() * 10) + 's';
        var size = 3 + Math.random() * 5;
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        box.appendChild(s);
      }
    })();
  </script>
</body>
</html>
